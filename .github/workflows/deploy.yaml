name: Deploy to Production (Terraform + ECS + Amplify)

on:
  push:
    branches:
      - prod
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yaml'
      - 'infrastructure/production/**'
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: 'Skip Terraform deployment'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  BACKEND_ECR: horrocruxes-backend
  TERRAFORM_DIR: infrastructure/production

jobs:
  # ============================================
  # Deploy Infrastructure with Terraform
  # ============================================
  deploy-terraform:
    name: Deploy Infrastructure (Terraform)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      backend_changed: ${{ steps.backend-changes.outputs.backend }}
      frontend_changed: ${{ steps.frontend-changes.outputs.frontend }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect backend changes
        id: backend-changes
        uses: dorny/paths-filter@v2
        with:
          from: prod
          filters: |
            backend:
              - 'backend/**'

      - name: Detect frontend changes
        id: frontend-changes
        uses: dorny/paths-filter@v2
        with:
          from: prod
          filters: |
            frontend:
              - 'frontend/**'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=central-tfstate-estanix-871696174477" \
            -backend-config="key=horrocruxes/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=production" \
            -var="alb_certificate_arn=${{ secrets.ALB_CERTIFICATE_ARN || '' }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        if: ${{ !inputs.skip_terraform }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Terraform Output
        working-directory: ${{ env.TERRAFORM_DIR }}
        if: ${{ !inputs.skip_terraform }}
        run: |
          echo "ALB_DNS=$(terraform output -raw backend_alb_dns_name)" >> $GITHUB_ENV
          echo "BACKEND_CHANGES=${{ needs.deploy-terraform.outputs.backend }}" >> $GITHUB_ENV
          echo "FRONTEND_CHANGES=${{ needs.deploy-terraform.outputs.frontend }}" >> $GITHUB_ENV
          echo "Backend changed: ${{ needs.deploy-terraform.outputs.backend }}"
          echo "Frontend changed: ${{ needs.deploy-terraform.outputs.frontend }}"
          echo "✅ Terraform infrastructure deployed"

  # ============================================
  # Deploy Backend to ECS
  # ============================================
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: deploy-terraform
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image exists
        id: image-exists
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          # Check if latest tag exists
          docker manifest inspect $ECR_REGISTRY/${{ env.BACKEND_ECR }}:latest >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set image tag
        if: needs.deploy-terraform.outputs.backend == 'true' || steps.image-exists.outputs.image_exists == 'false'
        run: |
          IMAGE_TAG="v${{ github.sha }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push backend image
        if: needs.deploy-terraform.outputs.backend == 'true' || steps.image-exists.outputs.image_exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/${{ env.BACKEND_ECR }}:${{ env.IMAGE_TAG }} \
            --tag $ECR_REGISTRY/${{ env.BACKEND_ECR }}:latest \
            --file backend/Dockerfile.prod \
            backend/
          
          docker push $ECR_REGISTRY/${{ env.BACKEND_ECR }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.BACKEND_ECR }}:latest

      - name: Update ECS task definition
        if: needs.deploy-terraform.outputs.backend == 'true' || steps.image-exists.outputs.image_exists == 'false'
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          
          # Get latest task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition horrocruxes-backend \
            --query 'taskDefinition' \
            --output json) || TASK_DEF="{}"
          
          if [ "$TASK_DEF" != "{}" ]; then
            NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
              --arg IMAGE "$ECR_REGISTRY/${{ env.BACKEND_ECR }}:${{ env.IMAGE_TAG }}" \
              '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
            
            aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF"
          else
            echo "Task definition not found - will be created by Terraform"
          fi

      - name: Update ECS service
        if: needs.deploy-terraform.outputs.backend == 'true' || steps.image-exists.outputs.image_exists == 'false'
        run: |
          aws ecs update-service \
            --cluster horrocruxes-backend-production \
            --service horrocruxes-backend-production \
            --force-new-deployment || \
            echo "Service update skipped - may not exist yet"

      - name: Wait for deployment
        if: needs.deploy-terraform.outputs.backend == 'true' || steps.image-exists.outputs.image_exists == 'false'
        run: |
          aws ecs wait services-stable \
            --cluster horrocruxes-backend-production \
            --services horrocruxes-backend-production 2>/dev/null || \
            echo "Wait skipped - cluster may not be ready"

      - name: No backend changes
        if: needs.deploy-terraform.outputs.backend != 'true' && steps.image-exists.outputs.image_exists == 'true'
        run: echo "No backend changes and image exists - skipping backend deployment"

      - name: Get ALB DNS
        id: alb-dns
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names horrocruxes-backend-production \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$ALB_DNS" ]; then
            echo "ALB_DNS=$ALB_DNS" >> $GITHUB_ENV
            echo "Backend: http://$ALB_DNS:8000"
          else
            ALB_DNS=$(terraform output -raw backend_alb_dns_name 2>/dev/null || echo "")
            echo "ALB_DNS=$ALB_DNS" >> $GITHUB_ENV
            echo "Backend: http://$ALB_DNS:8000"
          fi

  # ============================================
  # Deploy Frontend to Amplify
  # ============================================
  deploy-frontend:
    name: Deploy Frontend to Amplify
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Amplify app status
        id: amplify-status
        run: |
          APP_ID=$(aws amplify list-apps \
            --query "apps[?name=='horrocruxes-production'].appId" \
            --output text 2>/dev/null || echo "")
          
          echo "APP_ID=$APP_ID"
          
          if [ -n "$APP_ID" ]; then
            echo "app_exists=true" >> $GITHUB_OUTPUT
            echo "APP_ID=$APP_ID" >> $GITHUB_ENV
            echo "✅ Amplify app found: $APP_ID"
          else
            echo "app_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Amplify app found"
          fi

      - name: Update SSM with VITE_API_URL
        run: |
          echo "Checking ALB..."
          ALB_DNS="${{ env.ALB_DNS }}"
          echo "ALB_DNS from env: '$ALB_DNS'"
          
          if [ -z "$ALB_DNS" ]; then
            echo "ALB_DNS not set in env, checking AWS..."
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --names horrocruxes-backend-production \
              --query 'LoadBalancers[0].DNSName' \
              --output text 2>/dev/null || echo "")
            echo "ALB_DNS from AWS: '$ALB_DNS'"
          fi
          
          # Fallback: get from Terraform output
          if [ -z "$ALB_DNS" ]; then
            echo "Trying Terraform output..."
            cd ${{ env.TERRAFORM_DIR }}
            ALB_DNS=$(terraform output -raw backend_alb_dns_name 2>/dev/null || echo "")
            echo "ALB_DNS from TF: '$ALB_DNS'"
          fi
          
          if [ -n "$ALB_DNS" ]; then
            echo "✅ Found ALB: $ALB_DNS"
            aws ssm put-parameter \
              --name /horrocruxes/production/VITE_API_URL \
              --value "http://$ALB_DNS:8080" \
              --type String \
              --overwrite
            echo "VITE_API_URL updated to: http://$ALB_DNS:8080"
          else
            echo "❌ ALB DNS not found - backend may not be deployed"
          fi

      - name: Get or Create Amplify App with GitHub
        run: |
          echo "GH_TOKEN set: $([ -n '${{ secrets.GH_TOKEN }}' ] && echo 'yes' || echo 'no')"
          echo "Current APP_ID: ${{ env.APP_ID }}"
          
          if [ -n "${{ secrets.GH_TOKEN }}" ]; then
            if [ -z "${{ env.APP_ID }}" ]; then
              echo "Creating new Amplify app with GitHub connection..."
              
              APP_ID=$(aws amplify create-app \
                --name horrocruxes-production \
                --repository "https://github.com/${{ github.repository }}" \
                --oauth-token "${{ secrets.GH_TOKEN }}" \
                --default-branch prod \
                --query 'app.appId' \
                --output text 2>&1)
              
              echo "Create result: $APP_ID"
              
              if echo "$APP_ID" | grep -q "^a"; then
                echo "Created Amplify app: $APP_ID"
                echo "APP_ID=$APP_ID" >> $GITHUB_ENV
                sleep 15
              else
                echo "Failed to create app: $APP_ID"
              fi
            else
              echo "Using existing Amplify app: ${{ env.APP_ID }}"
              
              # Check if connected to GitHub
              APP_DETAILS=$(aws amplify get-app --app-id ${{ env.APP_ID }} 2>&1)
              REPO_INFO=$(echo "$APP_DETAILS" | jq -r '.app.repository // "none"' 2>/dev/null || echo "none")
              echo "Repository: $REPO_INFO"
              
              if [ -z "$REPO_INFO" ] || [ "$REPO_INFO" = "none" ] || [ "$REPO_INFO" = "null" ]; then
                echo "⚠️ App not connected to GitHub - trying update-app..."
                
                # Try to update the app to connect to GitHub
                UPDATE_RESULT=$(aws amplify update-app \
                  --app-id ${{ env.APP_ID }} \
                  --repository "https://github.com/${{ github.repository }}" \
                  --oauth-token "${{ secrets.GH_TOKEN }}" \
                  --default-branch prod \
                  2>&1)
                
                echo "Update result: $UPDATE_RESULT"
                sleep 10
                
                # Check again
                APP_DETAILS=$(aws amplify get-app --app-id ${{ env.APP_ID }} 2>&1)
                REPO_INFO=$(echo "$APP_DETAILS" | jq -r '.app.repository // "none"' 2>/dev/null || echo "none")
                echo "After update, Repository: $REPO_INFO"
              fi
            fi
          else
            echo "GH_TOKEN not set - Amplify skipped"
          fi

      - name: Start Amplify build
        run: |
          if [ -n "${{ env.APP_ID }}" ]; then
            echo "Starting Amplify build for app: ${{ env.APP_ID }}"
            
            # Debug: Get full app info
            echo "=== Debug: App Info ==="
            aws amplify get-app --app-id ${{ env.APP_ID }} --output json | jq '{repository, defaultBranch, productionBranch}'
            
            # Check branch exists
            echo "=== Checking prod branch ==="
            BRANCH_INFO=$(aws amplify get-branch \
              --app-id ${{ env.APP_ID }} \
              --branch-name prod \
              --output json 2>&1)
            echo "$BRANCH_INFO" | jq -r '.branch.branchName // "not found"'
            
            # Try start-job with full output
            echo "=== Triggering Amplify build ==="
            set -x
            JOB_RESULT=$(aws amplify start-job \
              --app-id ${{ env.APP_ID }} \
              --branch-name prod \
              --job-type RELEASE \
              2>&1)
            set +x
            echo "Raw result: $JOB_RESULT"
            
            # Parse job ID from JSON response
            JOB_ID=$(echo "$JOB_RESULT" | jq -r '.jobId // empty')
            
            if [ -n "$JOB_ID" ] && echo "$JOB_ID" | grep -q "^j-"; then
              echo "✅ Started build job: $JOB_ID"
            else
              echo "❌ Failed to start job"
              echo "Full response: $JOB_RESULT"
            fi
          else
            echo "No APP_ID - skipping Amplify build"
          fi

  # ============================================
  # Summary
  # ============================================
  post-deploy:
    name: Post Deployment Summary
    needs: [deploy-terraform, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    
    steps:
      - name: Check previous job results
        run: |
          # Check Terraform result
          if [ "${{ needs.deploy-terraform.result }}" = "failure" ]; then
            echo "❌ Terraform FAILED"
            TF_STATUS="❌ Failed"
            EXIT_CODE=1
          elif [ "${{ needs.deploy-terraform.result }}" = "skipped" ]; then
            echo "⏭️ Terraform skipped"
            TF_STATUS="⏭️ Skipped"
            EXIT_CODE=0
          else
            echo "✅ Terraform completed"
            TF_STATUS="✅ Deployed"
            EXIT_CODE=0
          fi
          
          # Check backend result (skipped if no changes)
          if [ "${{ needs.deploy-backend.result }}" = "failure" ]; then
            echo "❌ Backend FAILED"
            BACKEND_STATUS="❌ Failed"
            EXIT_CODE=1
          elif [ "${{ needs.deploy-terraform.outputs.backend }}" = "false" ]; then
            echo "⏭️ Backend skipped (no changes)"
            BACKEND_STATUS="⏭️ Skipped - No backend changes"
          elif [ "${{ needs.deploy-backend.result }}" = "skipped" ]; then
            echo "⏭️ Backend skipped"
            BACKEND_STATUS="⏭️ Skipped"
          else
            echo "✅ Backend deployed"
            BACKEND_STATUS="✅ Deployed"
          fi
          
          # Check frontend result (skipped if no changes)
          if [ "${{ needs.deploy-frontend.result }}" = "failure" ]; then
            echo "❌ Frontend FAILED"
            FRONTEND_STATUS="❌ Failed"
            EXIT_CODE=1
          elif [ "${{ needs.deploy-terraform.outputs.frontend }}" = "false" ]; then
            echo "⏭️ Frontend skipped (no changes)"
            FRONTEND_STATUS="⏭️ Skipped - No frontend changes"
          elif [ "${{ needs.deploy-frontend.result }}" = "skipped" ]; then
            echo "⏭️ Frontend skipped"
            FRONTEND_STATUS="⏭️ Skipped"
          else
            echo "✅ Frontend deployed"
            FRONTEND_STATUS="✅ Deployed"
          fi
          
          # Generate summary
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Terraform" >> $GITHUB_STEP_SUMMARY
          echo "- $TF_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo "- $BACKEND_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- $FRONTEND_STATUS" >> $GITHUB_STEP_SUMMARY
          
          # Exit with error if any failed
          if [ "$EXIT_CODE" = "1" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Some deployments failed - check logs above" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi