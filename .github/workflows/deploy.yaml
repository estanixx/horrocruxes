name: Deploy to Production (Terraform + ECS + Amplify)

on:
  push:
    branches:
      - prod
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yaml'
      - 'infrastructure/production/**'
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: 'Skip Terraform deployment'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  BACKEND_ECR: horrocruxes-backend
  TERRAFORM_DIR: infrastructure/production

jobs:
  # ============================================
  # Deploy Infrastructure with Terraform
  # ============================================
  deploy-terraform:
    name: Deploy Infrastructure (Terraform)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=central-tfstate-estanix-871696174477" \
            -backend-config="key=horrocruxes/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=production" \
            -var="alb_certificate_arn=${{ secrets.ALB_CERTIFICATE_ARN || '' }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        if: ${{ !inputs.skip_terraform }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: ${{ !inputs.skip_terraform }}
        run: |
          echo "ALB_DNS=$(terraform output -raw backend_alb_dns_name)" >> $GITHUB_ENV
          echo "✅ Terraform infrastructure deployed"

  # ============================================
  # Deploy Backend to ECS
  # ============================================
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: deploy-terraform
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          IMAGE_TAG="v${{ github.sha }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/${{ env.BACKEND_ECR }}:${{ env.IMAGE_TAG }} \
            --tag $ECR_REGISTRY/${{ env.BACKEND_ECR }}:latest \
            --file backend/Dockerfile.prod \
            backend/
          
          docker push $ECR_REGISTRY/${{ env.BACKEND_ECR }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.BACKEND_ECR }}:latest

      - name: Update ECS task definition
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          
          # Check if task definition exists
          aws ecs describe-task-definition --task-definition horrocruxes-backend 2>/dev/null && \
            TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition horrocruxes-backend \
              --query 'taskDefinition' \
              --output json) || \
            TASK_DEF="{}"
          
          if [ "$TASK_DEF" != "{}" ]; then
            NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
              --arg IMAGE "$ECR_REGISTRY/${{ env.BACKEND_ECR }}:${{ env.IMAGE_TAG }}" \
              '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
            
            aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF"
          else
            echo "Task definition not found - will be created by Terraform"
          fi

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster horrocruxes-backend-production \
            --service horrocruxes-backend-production \
            --force-new-deployment || \
            echo "Service update skipped - may not exist yet"

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster horrocruxes-backend-production \
            --services horrocruxes-backend-production 2>/dev/null || \
            echo "Wait skipped - cluster may not be ready"

      - name: Get ALB DNS
        id: alb-dns
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names horrocruxes-backend-production \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$ALB_DNS" ]; then
            echo "ALB_DNS=$ALB_DNS" >> $GITHUB_ENV
            echo "Backend: http://$ALB_DNS:8000"
          else
            ALB_DNS=$(terraform output -raw backend_alb_dns_name 2>/dev/null || echo "")
            echo "ALB_DNS=$ALB_DNS" >> $GITHUB_ENV
            echo "Backend: http://$ALB_DNS:8000"
          fi

  # ============================================
  # Deploy Frontend to Amplify
  # ============================================
  deploy-frontend:
    name: Deploy Frontend to Amplify
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update SSM with VITE_API_URL
        run: |
          # Get ALB DNS from environment or Terraform
          ALB_DNS="${{ env.ALB_DNS }}"
          if [ -z "$ALB_DNS" ]; then
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --names horrocruxes-backend-production \
              --query 'LoadBalancers[0].DNSName' \
              --output text 2>/dev/null || echo "")
          fi
          
          if [ -n "$ALB_DNS" ]; then
            aws ssm put-parameter \
              --name /horrocruxes/production/VITE_API_URL \
              --value "http://$ALB_DNS:8000" \
              --type String \
              --overwrite
            echo "VITE_API_URL updated"
          else
            echo "Warning: ALB DNS not found, skipping SSM update"
          fi

      - name: Get or Create Amplify App
        id: amplify-app
        run: |
          # Try to find existing Amplify app
          APP_ID=$(aws amplify list-apps \
            --query "apps[?name=='horrocruxes-production'].appId" \
            --output text)
          
          if [ -z "$APP_ID" ]; then
            echo "Creating new Amplify app..."
            # Need OAuth token for GitHub
            if [ -n "${{ secrets.GH_TOKEN }}" ]; then
              APP_ID=$(aws amplify create-app \
                --name horrocruxes-production \
                --repository https://github.com/${{ github.repository }} \
                --oauth-token "${{ secrets.GH_TOKEN }}" \
                --query 'app.appId' \
                --output text)
              echo "Created Amplify app: $APP_ID"
            else
              echo "GH_TOKEN not set - Amplify app needs manual creation"
              echo "APP_ID=" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "Using existing Amplify app: $APP_ID"
          fi
          
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV

      - name: Start Amplify build
        if: env.APP_ID != ''
        run: |
          # Create branch if needed
          aws amplify get-branch \
            --app-id ${{ env.APP_ID }} \
            --branch-name prod \
            || aws amplify create-branch \
              --app-id ${{ env.APP_ID }} \
              --branch-name prod \
              --stage PRODUCTION
          
          # Trigger build
          JOB_ID=$(aws amplify start-job \
            --app-id ${{ env.APP_ID }} \
            --branch-name prod \
            --job-type BUILD \
            --query 'jobId' \
            --output text)
          
          echo "Started build: $JOB_ID"

  # ============================================
  # Summary
  # ============================================
  post-deploy:
    name: Post Deployment Summary
    needs: [deploy-backend, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Summary
        run: |
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure (Terraform)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ECS Cluster, Services, ALB" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Amplify App" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Built and pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployed to ECS Fargate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SSM updated with VITE_API_URL" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployed to Amplify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secrets" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stored in SSM Parameter Store" >> $GITHUB_STEP_SUMMARY