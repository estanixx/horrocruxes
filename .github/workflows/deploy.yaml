name: Deploy to AWS AppRunner

on:
  push:
    branches:
      - prod
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: horrocruxes-backend
  APP_RUNNER_SERVICE_NAME: horrocruxes-backend
  DOCKERFILE_PATH: backend/Dockerfile.prod
  CONTEXT_PATH: backend

jobs:
  deploy:
    name: Deploy to AWS AppRunner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Full image: horrocruxes-backend:$IMAGE_TAG"

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            --tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            --file ${{ env.DOCKERFILE_PATH }} \
            ${{ env.CONTEXT_PATH }}

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to AppRunner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          # 1. Corrected App Runner Source Configuration Schema
          SOURCE_CONFIG="AuthenticationConfiguration={AccessRoleArn=${{ secrets.ECR_ACCESS_ROLE_ARN }}},ImageRepository={ImageIdentifier=$IMAGE_URI,ImageRepositoryType=ECR}"

          # 2. Check if service exists by filtering the list (returns ARN if exists, empty if not)
          SERVICE_ARN=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_NAME }}'].ServiceArn" \
            --output text)

          if [ -z "$SERVICE_ARN" ]; then
            echo "Service not found. Creating new AppRunner service..."
            
            # create-service returns the full JSON. We extract the new ARN immediately.
            SERVICE_ARN=$(aws apprunner create-service \
              --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} \
              --source-configuration "$SOURCE_CONFIG" \
              --instance-configuration "Cpu=1 vCPU,Memory=2 GB" \
              --region ${{ env.AWS_REGION }} \
              --tags "Key=Project,Value=horrocruxes" "Key=Environment,Value=production" \
              --query "Service.ServiceArn" \
              --output text)

            echo "Waiting for service to become active..."
            # Now we can safely use the ARN for the waiter
            aws apprunner wait service-active --service-arn $SERVICE_ARN --region ${{ env.AWS_REGION }}
            
          else
            echo "Service found (ARN: $SERVICE_ARN). Updating existing AppRunner service..."
            
            # update-service REQUIRES the ARN, not the name
            aws apprunner update-service \
              --service-arn $SERVICE_ARN \
              --source-configuration "$SOURCE_CONFIG" \
              --region ${{ env.AWS_REGION }}

            echo "Waiting for service update to complete..."
            aws apprunner wait service-updated --service-arn $SERVICE_ARN --region ${{ env.AWS_REGION }}
          fi

      - name: Get AppRunner service URL
        id: service-url
        run: |
          SERVICE_DESC=$(aws apprunner describe-service \
            --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Service.ServiceUrl' \
            --output text)
          echo "service_url=$SERVICE_DESC" >> $GITHUB_OUTPUT
          echo "Service URL: $SERVICE_DESC"

      - name: Health check
        env:
          SERVICE_URL: ${{ steps.service-url.outputs.service_url }}
        run: |
          echo "Waiting for application to be ready..."
          sleep 30
          
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.SERVICE_URL }}/health || echo "000")
          echo "Health check response: $response"
          
          if [ "$response" = "200" ]; then
            echo "Deployment successful!"
          else
            echo "Warning: Health check returned $response"
          fi

      - name: Post deployment info
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.APP_RUNNER_SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ steps.service-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY