name: Deploy to AWS AppRunner

on:
  push:
    branches:
      - prod
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: horrocruxes-backend
  APP_RUNNER_SERVICE_NAME: horrocruxes-backend
  DOCKERFILE_PATH: backend/Dockerfile.prod
  CONTEXT_PATH: backend

jobs:
  deploy:
    name: Deploy to AWS AppRunner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi
          echo "image_tag=${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "Full image: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            --tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            --file ${{ env.DOCKERFILE_PATH }} \
            ${{ env.CONTEXT_PATH }}
          
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to AppRunner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          # Check if AppRunner service exists
          SERVICE_STATUS=$(aws apprunner describe-service --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} --region ${{ env.AWS_REGION }} 2>&1 || echo "NOT_FOUND")
          
          if echo "$SERVICE_STATUS" | grep -q "NOT_FOUND"; then
            echo "Creating new AppRunner service..."
            aws apprunner create-service \
              --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} \
              --source-configuration "ImageRepository={ImageIdentifier=$IMAGE_URI,ImageRepositoryType=ECR}" \
              --auto-scaling-configuration-arn "arn:aws:apprunner:${{ env.AWS_REGION }}::autoscalingconfiguration/default" \
              --instance-configuration "Cpu=1024 vCPU,Memory=2048 MB" \
              --region ${{ env.AWS_REGION }} \
              --tags "Key=Project,Value=horrocruxes" "Key=Environment,Value=production"

            echo "Waiting for service to become active..."
            aws apprunner wait service-active --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} --region ${{ env.AWS_REGION }}
          else
            echo "Updating existing AppRunner service..."
            aws apprunner update-service \
              --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} \
              --source-configuration "ImageRepository={ImageIdentifier=$IMAGE_URI,ImageRepositoryType=ECR}" \
              --region ${{ env.AWS_REGION }}

            echo "Waiting for service to become active..."
            aws apprunner wait service-active --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} --region ${{ env.AWS_REGION }}
          fi

      - name: Get AppRunner service URL
        id: service-url
        run: |
          SERVICE_DESC=$(aws apprunner describe-service \
            --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Service.ServiceUrl' \
            --output text)
          echo "service_url=$SERVICE_DESC" >> $GITHUB_OUTPUT
          echo "Service URL: $SERVICE_DESC"

      - name: Health check
        env:
          SERVICE_URL: ${{ steps.service-url.outputs.service_url }}
        run: |
          echo "Waiting for application to be ready..."
          sleep 30
          
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.SERVICE_URL }}/health || echo "000")
          echo "Health check response: $response"
          
          if [ "$response" = "200" ]; then
            echo "Deployment successful!"
          else
            echo "Warning: Health check returned $response"
          fi

      - name: Post deployment info
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.APP_RUNNER_SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ steps.service-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY