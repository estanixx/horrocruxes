AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates OIDC Provider, IAM Role for GitHub Actions, ECR Repositories,
  SSM Parameters for secrets, and prepares infrastructure for
  Horrocruxes deployment to ECS + Amplify.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or username
    Default: "estanixx"

  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: "horrocruxes"

  BackendEcrRepositoryName:
    Type: String
    Description: Name of the ECR repository for backend
    Default: "horrocruxes-backend"

  FrontendEcrRepositoryName:
    Type: String
    Description: Name of the ECR repository for frontend
    Default: "horrocruxes-frontend"

  Environment:
    Type: String
    Description: Environment name for resource tagging
    Default: "production"
    
  GitHubOIDCProviderArn:
    Type: String
    Description: ARN of the GitHub OIDC Provider (created in a separate stack)
    Default: "arn:aws:iam::871696174477:oidc-provider/token.actions.githubusercontent.com"
  
  # Secret values - these will be stored in SSM
  GoogleAPIKey:
    Type: String
    Description: Google API Key for Gemini (will be stored in SSM)
    Default: ""

  PineconeAPIKey:
    Type: String
    Description: Pinecone API Key (will be stored in SSM)
    Default: ""

Resources:


  # ============================================
  # IAM Role for GitHub Actions (updated for ECS + Amplify + Terraform)
  # ============================================
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "horrocruxes-github-actions-${Environment}"
      Description: Role for GitHub Actions to deploy to ECS, Amplify, and run Terraform
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProviderArn
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
              StringEquals:
                token.actions.githubusercontent.com:aud: "sts.amazonaws.com"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess
        - arn:aws:iam::aws:policy/AWSCodeBuildDeveloperAccess
        - arn:aws:iam::aws:policy/service-role/AmplifyBackendDeployFullAccess
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
      Policies:
        - PolicyName: PassRoleForECS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/horrocruxes-ecs-*"
        - PolicyName: PassRoleForALB
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/horrocruxes-alb-*"
        - PolicyName: EC2FullAccessForTerraform
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DescribeTags
                  - ec2:DescribeInstances
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeRouteTables
                Resource: "*"
        - PolicyName: AmplifyFullAccessForTerraform
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - amplify:CreateApp
                  - amplify:UpdateApp
                  - amplify:DeleteApp
                  - amplify:GetApp
                  - amplify:GetBranch
                  - amplify:CreateBranch
                  - amplify:UpdateBranch
                  - amplify:DeleteBranch
                  - amplify:CreateWebhook
                  - amplify:DeleteWebhook
                  - amplify:StartJob
                  - amplify:StartDeployment
                  - amplify:TagResource
                  - amplify:UntagResource
                  - amplify:ListApps
                  - amplify:ListBranches
                Resource: "*"
        - PolicyName: AppAutoScalingFullAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:DeregisterScalableTarget
                  - application-autoscaling:DescribeScalableTargets
                  - application-autoscaling:TagResource
                  - application-autoscaling:ListTagsForResource
                Resource: "*"
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/horrocruxes/*"
        - PolicyName: TerraformBackendAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: 
                  - !Sub "arn:aws:s3:::central-tfstate-estanix-871696174477"
                  - !Sub "arn:aws:s3:::central-tfstate-estanix-871696174477/*"
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/horrocruxes-terraform-locks"
      Tags:
        - Key: "Project"
          Value: "horrocruxes"
        - Key: "Environment"
          Value: !Ref Environment

  # ============================================
  # ECR Repository for Backend
  # ============================================
  BackendECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref BackendEcrRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: "MUTABLE"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only last 10 images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: "Project"
          Value: "horrocruxes"
        - Key: "Environment"
          Value: !Ref Environment

  # ============================================
  # SSM Parameter Store - Secrets
  # Note: Using String type - values are masked in AWS Console
  # The NoEcho property hides the value in CloudFormation outputs
  # ============================================
  GoogleAPIKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/horrocruxes/${Environment}/GOOGLE_API_KEY"
      Type: String
      Value: !Ref GoogleAPIKey
      Description: Google API Key for Horrocruxes
      Tier: Standard

  PineconeAPIKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/horrocruxes/${Environment}/PINECONE_API_KEY"
      Type: String
      Value: !Ref PineconeAPIKey
      Description: Pinecone API Key for Horrocruxes
      Tier: Standard

  ViteAPIURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/horrocruxes/${Environment}/VITE_API_URL"
      Type: String
      Value: "http://horrocruxes-backend-production-123456789.us-east-1.elb.amazonaws.com"
      Description: Backend API URL for frontend (update after ALB is created)
      Tier: Standard



Outputs:

  GitHubActionsRoleArn:
    Description: "ARN of the GitHub Actions IAM Role"
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GitHubActionsRoleArn"

  BackendECRRepositoryUri:
    Description: "URI of the Backend ECR Repository"
    Value: !GetAtt BackendECRRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-BackendECRRepositoryUri"

  SSMGoogleAPIKeyArn:
    Description: "ARN of the Google API Key SSM Parameter"
    Value: !Ref GoogleAPIKeyParameter
    Export:
      Name: !Sub "${AWS::StackName}-SSMGoogleAPIKeyArn"

  SSMPineconeAPIKeyArn:
    Description: "ARN of the Pinecone API Key SSM Parameter"
    Value: !Ref PineconeAPIKeyParameter
    Export:
      Name: !Sub "${AWS::StackName}-SSMPineconeAPIKeyArn"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "GitHub Configuration"
        Parameters:
          - GitHubOrg
          - GitHubRepo
      - Label:
          default: "AWS Resources"
        Parameters:
          - BackendEcrRepositoryName
          - Environment
      - Label:
          default: "Secrets"
        Parameters:
          - GoogleAPIKey
          - PineconeAPIKey

    ParameterLabels:
      GitHubOrg:
        default: "GitHub Organization"
      GitHubRepo:
        default: "GitHub Repository"
      BackendEcrRepositoryName:
        default: "Backend ECR Repository Name"
      Environment:
        default: "Environment"
      GoogleAPIKey:
        default: "Google API Key"
      PineconeAPIKey:
        default: "Pinecone API Key"
      EcrRepositoryName:
        default: "ECR Repository Name"
      Environment:
        default: "Environment"
